services:
  api:
    build: .
    environment:
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_VERSION: ${API_VERSION:-1.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATA_LOCAL_DIR: ${DATA_LOCAL_DIR:-./data/processed}
      RUTA_PENDIENTE: ${RUTA_PENDIENTE:-./map_mart/slope_5m.tif}
      DATA_FILE_PATH: ${DATA_FILE_PATH:-./data/static/layers.json}
      VISUAL_DATA_DIR: ${VISUAL_DATA_DIR:-./data/visual}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./map_mart:/app/map_mart:ro