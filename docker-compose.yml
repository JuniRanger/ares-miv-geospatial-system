services:
  api:
    build: .
    environment:
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_VERSION: ${API_VERSION:-1.1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATA_LOCAL_DIR: ${DATA_LOCAL_DIR:-/tmp/mars-data}
      RUTA_PENDIENTE: ${RUTA_PENDIENTE:-/tmp/mars-data/slope_5m.tif}
      DATA_FILE_PATH: ${DATA_FILE_PATH:-./data/static/layers.json}
      VISUAL_DATA_DIR: ${VISUAL_DATA_DIR:-./data/visual}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      S3_BUCKET: ${S3_BUCKET:-mars-terrain-data-2026}
      S3_KEY: ${S3_KEY:-slope_5m.tif}
      S3_REGION: ${S3_REGION:-us-east-2}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_VERSION_ID: ${S3_VERSION_ID:-}
      S3_SHA256: ${S3_SHA256:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./data/processed:/app/data/processed